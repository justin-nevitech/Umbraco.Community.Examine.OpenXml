name: Release Package

# Starts when a correctly formatted version tag is pushed.
# Packaging is version-aligned: the package major tracks the Umbraco major, so the
# project to pack is selected from the tag's leading major number:
#   tag 13.1.0      -> Umbraco.Community.Examine.OpenXml.v13  (Umbraco [13,14), net8.0)
#   tag 17.0.0      -> Umbraco.Community.Examine.OpenXml.v17  (Umbraco [17,18), net10.0)
#   tag 18.0.0      -> Umbraco.Community.Examine.OpenXml.v18  (Umbraco [18,19), net10.0)
# All three variants build the same sources and publish under one PackageId.
# Both stable (1.2.3) and prerelease (1.2.3-rc1) tags are supported.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Select package project from tag major
        id: project
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          case "$major" in
            13|17|18)
              path="src/Umbraco.Community.Examine.OpenXml.v$major/Umbraco.Community.Examine.OpenXml.v$major.csproj"
              tests="src/Umbraco.Community.Examine.OpenXml.Tests.v$major/Umbraco.Community.Examine.OpenXml.Tests.v$major.csproj" ;;
            *)  echo "::error::Tag major '$major' has no matching package project (expected 13, 17 or 18)." && exit 1 ;;
          esac
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "path=$path"   >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      # Gate the release on the suite for the major being published, so a broken tag cannot
      # reach NuGet. The test project references the same package project that is packed below.
      - name: Test
        run: dotnet test ${{steps.project.outputs.tests}} -c Release

      - name: Build & Pack
        run: dotnet pack ${{steps.project.outputs.path}} -c Release /p:Version=${{github.ref_name}} -o ${{github.workspace}}/artifacts

      - name: Push to NuGet
        run: dotnet nuget push "${{github.workspace}}/artifacts/*.nupkg" -k ${{secrets.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json
